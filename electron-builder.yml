appId: com.bis.aluminum.management
productName: BIS Aluminum Management
copyright: Copyright © 2025

directories:
  output: dist
  buildResources: public

files:
  - electron/**/*
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - package.json
  - "!node_modules/**/*"
  - "!**/*.ts"
  - "!**/*.map"
  - "!src/**/*"
  - "!scripts/**/*"

extraResources:
  - from: .next/standalone
    to: app/.next/standalone
    filter:
      - "**/*"
  - from: .next/static
    to: app/.next/static
    filter:
      - "**/*"
  - from: public
    to: app/public
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  perMachine: false
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  license: LICENSE.txt

mac:
  target:
    - dmg
  icon: public/icon.icns
  category: public.app-category.business

linux:
  target:
    - AppImage
    - deb
  icon: public/icon.png
  category: Office